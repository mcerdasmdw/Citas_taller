services:
  - type: web
    name: citas-taller
    env: python
    plan: free
    buildCommand: uv sync
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        # Ruta relativa: SQLite queda en instance/citas.db (filesystem del plan Free).
        # Si pagas un plan con disco persistente, usa "sqlite:////data/citas.db"
        # (4 barras) y descomenta el bloque disk: de abajo.
        value: sqlite:///citas.db
      - key: IA_PROVIDER
        value: simulado
      - key: IA_API_KEY
        sync: false
      - key: IA_MODEL
        value: pendiente
      # Credenciales del usuario unico (login). El valor se define en el panel
      # de Render al crear/actualizar el servicio; nunca se sube a Git.
      - key: APP_USUARIO
        sync: false
      - key: APP_CLAVE
        sync: false
    # Los persistent disks NO estan disponibles en el plan free de Render.
    # Para mantener datos entre despliegues, paga un plan y descomenta:
    # disk:
    #   name: citas-data
    #   mountPath: /data
    #   sizeGB: 1
