[project]
name = "citas-taller"
version = "0.1.0"
description = "App de control de citas de revisión de carros (taller y domicilio)"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
exclude-newer = "2026-01-01"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
