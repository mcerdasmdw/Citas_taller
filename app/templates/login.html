<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · CitasTaller</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body class="cuerpo-login">
<div class="caja-login">
    <div class="cabecera">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="Logo CitasTaller">
        <h1>CitasTaller</h1>
        <p>Ingresa tus datos para entrar</p>
    </div>
    <div class="card">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
            {% endfor %}
        {% endwith %}
        <form method="post" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="email" id="usuario" name="usuario" required autofocus>
            </div>
            <div class="form-group">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" required>
            </div>
            <button type="submit" class="btn btn-bloque">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>
