<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · CitasTaller</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body class="cuerpo-login">
<div class="caja-login">
    <div class="cabecera">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="Logo CitasTaller">
        <h1>CitasTaller</h1>
        <p>Ingresa tus datos para entrar</p>
    </div>
    <div class="card">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
            {% endfor %}
        {% endwith %}
        <form method="post" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="email" id="usuario" name="usuario" required autofocus>
            </div>
            <div class="form-group">
                <label for="clave">Contraseña</label>
                <div class="campo-con-accion">
                    <input type="password" id="clave" name="clave" required>
                    <button type="button" class="boton-ver-clave" id="boton-ver-clave"
                            aria-pressed="false" aria-controls="clave"
                            title="Mostrar contraseña" aria-label="Mostrar contraseña">
                        <svg class="icono-ver" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icono-ocultar" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-bloque">Entrar</button>
        </form>
    </div>
</div>
<script>
    const botonVerClave = document.getElementById('boton-ver-clave');
    const campoClave = document.getElementById('clave');
    let claveVisible = false;
    botonVerClave.addEventListener('click', function () {
        claveVisible = !claveVisible;
        campoClave.type = claveVisible ? 'text' : 'password';
        const texto = claveVisible ? 'Ocultar contraseña' : 'Mostrar contraseña';
        botonVerClave.setAttribute('aria-pressed', String(claveVisible));
        botonVerClave.setAttribute('aria-label', texto);
        botonVerClave.title = texto;
    });
</script>
</body>
</html>
